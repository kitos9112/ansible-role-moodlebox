---
moodlebox_db_mount: /mnt/data
moodlebox_attach_existing_installation: false
moodlebox_upgrade_existing_installation: false
moodlebox_moodle_git_force_update: false
moodlebox_upgrade_run_as_user: www-data
moodlebox_additional_plugins: []
moodlebox_additional_plugins_force_update: false
moodlebox_additional_plugins_git_force_update: "{{ moodlebox_additional_plugins_force_update }}"
moodlebox_additional_plugins_zip_force_update: "{{ moodlebox_additional_plugins_force_update }}"

moodlebox_certbot_dir: /opt/certbot
moodlebox_docker_repo: "certbot/dns-cloudflare"
moodlebox_certbot_cf_repo: "{{ moodlebox_docker_repo }}"

moodlebox_tls_cert_pem: /etc/nginx/ssl/moodlebox.pem
moodlebox_tls_key_pem: /etc/nginx/ssl/moodlebox.key

moodlebox_webserver_user: root

moodlebox_uninstall_moodle: false

cf_email_address: ""
cloudflare_api_key: ""
moodlebox_cf_api_token: "{{ cloudflare_api_token | default('') }}"
moodlebox_cf_email_address: "{{ cloudflare_account_email | default(cf_email_address | default('')) }}"
moodlebox_cf_api_key: "{{ cloudflare_api_key | default('') }}"

moodlebox_borg_version: "1.4.0"
