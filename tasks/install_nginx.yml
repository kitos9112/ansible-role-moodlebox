---
- name: Detect Moodle public web root
  ansible.builtin.stat:
    path: "{{ moodlebox_moodle_source_dir }}/public/index.php"
  register: moodlebox_public_web_root

- name: Resolve NGINX document root for Moodle
  ansible.builtin.set_fact:
    moodlebox_nginx_docroot: >-
      {{
        moodlebox_moodle_source_dir ~ '/public'
        if (moodlebox_public_web_root.stat.exists | default(false))
        else moodlebox_moodle_source_dir
      }}

- name: Remove default site
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/sites-available/default
  notify: restart web services

- name: Configure nginx
  template:
    src: etc/nginx/sites-available/moodle.j2
    dest: /etc/nginx/sites-available/moodle.conf
    mode: 0644
  notify: restart web services

- name: Create a symbolic link
  file:
    src: /etc/nginx/sites-available/moodle.conf
    dest: /etc/nginx/sites-enabled/moodle.conf
    owner: root
    group: root
    state: link
  notify: restart web services

- include_tasks: install_acme_x509cert.yml

- name: Flush all handlers
  meta: flush_handlers
